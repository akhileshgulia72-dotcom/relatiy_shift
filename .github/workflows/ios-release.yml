name: iOS release

on:
  workflow_dispatch:
    inputs:
      upload_to_app_store_connect:
        description: Upload the signed IPA to App Store Connect
        required: true
        type: boolean
        default: false

jobs:
  ios:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      APP_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.agdevelps.realityshift' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_ADMOB_APP_ID: ${{ vars.IOS_ADMOB_APP_ID || 'ca-app-pub-7694497723149363~4777319882' }}
      IOS_ADMOB_REWARDED_ID: ${{ vars.IOS_ADMOB_REWARDED_ID || 'ca-app-pub-7694497723149363/6627081469' }}
      IOS_ADMOB_INTERSTITIAL_ID: ${{ vars.IOS_ADMOB_INTERSTITIAL_ID || 'ca-app-pub-7694497723149363/4454932430' }}
      PROFILE_NAME: ${{ vars.IOS_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check release configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_BUNDLE_ID APPLE_TEAM_ID IOS_ADMOB_APP_ID IOS_ADMOB_REWARDED_ID IOS_ADMOB_INTERSTITIAL_ID PROFILE_NAME; do
            if [ -z "${!name}" ]; then echo "Missing GitHub variable: $name"; exit 1; fi
          done
          if [[ "$APP_BUNDLE_ID" == com.example.* ]] || [[ "$IOS_ADMOB_APP_ID" == ca-app-pub-3940256099942544* ]]; then
            echo 'Release identifiers still contain placeholder/test values'; exit 1
          fi
          if [[ "$IOS_ADMOB_REWARDED_ID" == ca-app-pub-3940256099942544* ]] || [[ "$IOS_ADMOB_INTERSTITIAL_ID" == ca-app-pub-3940256099942544* ]]; then
            echo 'Production rewarded and interstitial ad unit IDs are required'; exit 1
          fi
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing GitHub secret: $name"; exit 1; fi
          done
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      - name: Install signing certificate and profile
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/release.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/release.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Configure iOS release identifiers
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib
          project = pathlib.Path('ios/Runner.xcodeproj/project.pbxproj')
          text = project.read_text()
          old = 'PRODUCT_BUNDLE_IDENTIFIER = com.agdevelps.realityshift;'
          if text.count(old) != 3:
              raise SystemExit('Unexpected Runner bundle ID layout; update iOS signing config')
          text = text.replace(old, f'PRODUCT_BUNDLE_IDENTIFIER = {os.environ["APP_BUNDLE_ID"]};')
          marker = '97C147071CF9000F007C117D /* Release */ = {'
          start = text.index(marker)
          settings = text.index('buildSettings = {', start) + len('buildSettings = {')
          signing = f'''\n                CODE_SIGN_STYLE = Manual;
                DEVELOPMENT_TEAM = {os.environ["APPLE_TEAM_ID"]};
                PROVISIONING_PROFILE_SPECIFIER = "{os.environ["PROFILE_NAME"]}";
                CODE_SIGN_IDENTITY = "Apple Distribution";'''
          text = text[:settings] + signing + text[settings:]
          project.write_text(text)
          info = pathlib.Path('ios/Runner/Info.plist')
          with info.open('rb') as handle: data = plistlib.load(handle)
          data['GADApplicationIdentifier'] = os.environ['IOS_ADMOB_APP_ID']
          with info.open('wb') as handle: plistlib.dump(data, handle)
          export = {
              'method': 'app-store-connect', 'signingStyle': 'manual',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'provisioningProfiles': {os.environ['APP_BUNDLE_ID']: os.environ['PROFILE_NAME']},
          }
          with open('ios/ExportOptions.plist', 'wb') as handle: plistlib.dump(export, handle)
          PY
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build signed IPA
        run: |
          flutter build ipa --release --build-number="$((GITHUB_RUN_NUMBER + 6))" \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=ADMOB_IOS_REWARDED_ID="$IOS_ADMOB_REWARDED_ID" \
            --dart-define=ADMOB_IOS_INTERSTITIAL_ID="$IOS_ADMOB_INTERSTITIAL_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: reality-shift-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_app_store_connect }}
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_PRIVATE_KEY"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
